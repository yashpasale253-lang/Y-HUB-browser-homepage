<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Y HUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23000'/><text x='50' y='72' font-size='58' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'>Y</text></svg>">
<style>
/* ============ TOKENS ============ */
:root{
  --accent:#7c5cff;
  --accent-rgb:124, 92, 255;
  --accent2:#22d3ee;
  --text:#f4f5fa;
  --muted:rgba(244,245,250,.52);
  --glass:rgba(255,255,255,.045);
  --glass-strong:rgba(255,255,255,.08);
  --brd:rgba(255,255,255,.09);
  --brd-strong:rgba(255,255,255,.16);
  --shadow:0 20px 60px rgba(0,0,0,.7);
  --smooth:cubic-bezier(.4,0,.2,1);
  --smooth-out:cubic-bezier(.16,1,.3,1);
  --sine:cubic-bezier(.45,.05,.55,.95);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:#000;color:var(--text);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(255,255,255,.25);color:#fff}

/* ============ BACKGROUND — BLACK DARK GLASS ============ */
.bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% -10%, rgba(255,255,255,.045), transparent 65%),
    radial-gradient(ellipse 60% 45% at 15% 105%, rgba(124,92,255,.06), transparent 70%),
    radial-gradient(ellipse 55% 45% at 88% 100%, rgba(34,211,238,.04), transparent 70%),
    #000;
}
.glow-orb{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(110px);
  will-change:transform,opacity;
  transform:translate3d(0,0,0);
}
.glow-orb.a{
  width:520px;height:520px;
  background:radial-gradient(circle, rgba(124,92,255,.28), transparent 70%);
  left:-12%;top:0%;
  animation:drift-a 32s var(--sine) infinite;
}
.glow-orb.b{
  width:460px;height:460px;
  background:radial-gradient(circle, rgba(34,211,238,.18), transparent 70%);
  right:-10%;top:10%;
  animation:drift-b 38s var(--sine) infinite;
}
@keyframes drift-a{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.65}
  50%{transform:translate3d(140px,90px,0) scale(1.15);opacity:.85}
}
@keyframes drift-b{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.55}
  50%{transform:translate3d(-160px,110px,0) scale(1.12);opacity:.8}
}

#particles{position:fixed;inset:0;z-index:1;pointer-events:none;will-change:transform}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,.55) 100%);
}

/* ============ TOP BAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:6;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 24px;gap:16px;pointer-events:none;
}
.topbar > *{pointer-events:auto}

.clock-card,.weather-card{
  background:rgba(255,255,255,.035);
  border:1px solid var(--brd);
  border-radius:16px;
  padding:11px 17px;
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 8px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
  transform:translateZ(0);
}
.clock-card{display:flex;flex-direction:column;gap:2px}
.clock-time{
  font-size:24px;font-weight:700;letter-spacing:.3px;
  font-variant-numeric:tabular-nums;line-height:1.05;
  display:flex;align-items:baseline;gap:1px;
}
.clock-sec{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.clock-ampm{font-size:10px;color:var(--muted);margin-left:5px;letter-spacing:1.2px}
.clock-date{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}

.weather-card{display:flex;align-items:center;gap:11px;min-width:145px;justify-content:center}
.weather-icon{font-size:24px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}
.weather-info{display:flex;flex-direction:column}
.weather-temp{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.weather-desc{font-size:10.5px;color:var(--muted);letter-spacing:.3px}

/* ============ CENTER STAGE ============ */
.stage{
  position:relative;z-index:3;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:110px 20px 60px;gap:0;text-align:center;
}

.greeting{
  font-size:11.5px;letter-spacing:5px;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:8px;
  animation:fadeUp 1s var(--smooth-out) both;
}
.greeting b{color:#fff;font-weight:800}

/* ============ FLOATING WHITE Y HUB LOGO ============ */
.logo-wrap{
  position:relative;
  display:inline-block;
  margin-bottom:22px;
  animation:fadeUp 1.1s .08s var(--smooth-out) both;
}
.logo-glow{
  position:absolute;
  left:50%;top:50%;
  width:130%;height:170%;
  transform:translate3d(-50%,-50%,0);
  background:radial-gradient(ellipse at center, rgba(255,255,255,.16), rgba(124,92,255,.10) 40%, transparent 68%);
  filter:blur(55px);
  pointer-events:none;
  will-change:transform,opacity;
  animation:glow-breathe 7s var(--sine) infinite;
}
@keyframes glow-breathe{
  0%,100%{opacity:.7;transform:translate3d(-50%,-50%,0) scale(1)}
  50%{opacity:1;transform:translate3d(-50%,-50%,0) scale(1.12)}
}

.logo{
  position:relative;
  display:inline-block;
  font-size:clamp(4rem,14vw,11rem);
  font-weight:900;
  letter-spacing:.035em;
  line-height:1;
  padding:.02em .08em .1em;
  background:linear-gradient(110deg,
    #ffffff 0%,
    #d4d4de 14%,
    #ffffff 28%,
    #ffffff 46%,
    #c9c9d5 62%,
    #ffffff 78%,
    #e8e8f0 90%,
    #ffffff 100%);
  background-size:240% 100%;
  background-position:0% 50%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  filter:
    drop-shadow(0 0 32px rgba(255,255,255,.30))
    drop-shadow(0 0 80px rgba(124,92,255,.18))
    drop-shadow(0 14px 40px rgba(0,0,0,.85));
  animation:
    logo-float 7s var(--sine) infinite,
    logo-shimmer 9s linear infinite;
  will-change:transform,background-position;
  user-select:none;
  cursor:default;
  transition:letter-spacing .7s var(--smooth-out);
}
.logo:hover{letter-spacing:.07em}
.logo.paused-float{
  animation:logo-shimmer 9s linear infinite;
}
@keyframes logo-float{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(0,-14px,0)}
}
@keyframes logo-shimmer{
  0%{background-position:0% 50%}
  100%{background-position:240% 50%}
}

.tagline{
  font-size:12.5px;color:var(--muted);letter-spacing:3px;
  text-transform:uppercase;margin-bottom:30px;
  animation:fadeUp 1.1s .18s var(--smooth-out) both;
  font-weight:500;
}

/* ============ SEARCH ============ */
.search-wrap{
  width:min(740px,92vw);
  position:relative;
  animation:fadeUp 1.1s .28s var(--smooth-out) both;
}
.search-container{
  position:relative;
  z-index:5;
}

.search{
  display:flex;align-items:center;gap:8px;
  padding:8px 8px 8px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--brd);
  backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  box-shadow:
    0 14px 44px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.08);
  transition:
    border-color .4s var(--smooth),
    box-shadow .4s var(--smooth),
    transform .4s var(--smooth),
    background .4s var(--smooth);
  transform:translateZ(0);
}
.search:focus-within{
  border-color:rgba(255,255,255,.28);
  background:rgba(255,255,255,.07);
  box-shadow:
    0 18px 55px rgba(0,0,0,.75),
    0 0 0 4px rgba(255,255,255,.055),
    inset 0 1px 0 rgba(255,255,255,.12);
  transform:translate3d(0,-2px,0);
}

.engine-wrap{position:relative;flex:0 0 auto}
.engine-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--brd);
  border-radius:999px;
  padding:6px 11px 6px 8px;cursor:pointer;
  color:var(--text);font-size:12.5px;font-weight:600;font-family:inherit;
  transition:background .35s var(--smooth), border-color .35s var(--smooth);
  transform:translateZ(0);
}
.engine-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.engine-dot{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;
  flex:0 0 auto;
}
.chev{width:10px;height:10px;opacity:.6;transition:transform .35s var(--smooth)}
.engine-wrap.open .chev{transform:rotate(180deg)}

.engine-menu{
  position:absolute;top:calc(100% + 12px);left:0;
  min-width:210px;padding:6px;
  background:rgba(10,10,14,.94);
  border:1px solid var(--brd-strong);border-radius:16px;
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  box-shadow:0 24px 70px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;visibility:hidden;
  transform:translate3d(0,-8px,0) scale(.97);
  transition:opacity .3s var(--smooth), transform .3s var(--smooth-out), visibility .3s;
  z-index:20;transform-origin:top left;
}
.engine-wrap.open .engine-menu{
  opacity:1;visibility:visible;
  transform:translate3d(0,0,0) scale(1);
}
.engine-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:13px;font-weight:500;
  border-radius:11px;cursor:pointer;text-align:left;
  transition:background .25s var(--smooth);
}
.engine-item:hover{background:rgba(255,255,255,.09)}
.engine-item.active{background:rgba(255,255,255,.12)}
.engine-item .check{margin-left:auto;opacity:0;color:#fff;font-weight:800;font-size:12px}
.engine-item.active .check{opacity:1}

#q{
  flex:1 1 auto;min-width:0;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:inherit;font-size:16px;font-weight:400;
  padding:9px 4px;letter-spacing:.2px;
  transition:color .3s var(--smooth);
}
#q::placeholder{color:rgba(244,245,250,.36);transition:color .3s var(--smooth)}
#q:focus::placeholder{color:rgba(244,245,250,.5)}

.go-btn{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;
  border:none;cursor:pointer;display:grid;place-items:center;
  background:#fff;
  color:#000;font-size:17px;
  box-shadow:0 6px 22px rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.06);
  transition:transform .35s var(--smooth-out), box-shadow .35s var(--smooth);
  transform:translateZ(0);
  will-change:transform;
}
.go-btn:hover{
  transform:scale(1.08) rotate(-8deg);
  box-shadow:0 8px 28px rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.06);
}
.go-btn:active{transform:scale(.92)}

/* ============ SUGGESTIONS DROPDOWN ============ */
.suggestions{
  position:absolute;
  top:calc(100% + 10px);
  left:0;right:0;
  padding:6px;
  background:rgba(10,10,14,.94);
  border:1px solid var(--brd-strong);
  border-radius:20px;
  backdrop-filter:blur(34px) saturate(180%);
  -webkit-backdrop-filter:blur(34px) saturate(180%);
  box-shadow:
    0 24px 70px rgba(0,0,0,.88),
    0 0 0 1px rgba(255,255,255,.04),
    inset 0 1px 0 rgba(255,255,255,.08);
  opacity:0;
  visibility:hidden;
  transform:translate3d(0,-8px,0) scale(.98);
  transition:
    opacity .28s var(--smooth),
    transform .35s var(--smooth-out),
    visibility .28s;
  transform-origin:top center;
  z-index:18;
  max-height:380px;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
.suggestions::-webkit-scrollbar{width:6px}
.suggestions::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.suggestions::-webkit-scrollbar-track{background:transparent}

.suggestions.open{
  opacity:1;
  visibility:visible;
  transform:translate3d(0,0,0) scale(1);
}

.suggestion-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  border-radius:13px;
  cursor:pointer;
  color:var(--text);
  font-size:14.5px;
  font-weight:400;
  letter-spacing:.1px;
  transition:background .2s var(--smooth), transform .25s var(--smooth-out);
  user-select:none;
  transform:translateZ(0);
}
.suggestion-item.active{
  background:rgba(255,255,255,.085);
}
.suggestion-icon{
  width:26px;height:26px;border-radius:9px;
  display:grid;place-items:center;flex:0 0 auto;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.72);
  font-size:12px;
  transition:background .25s var(--smooth), color .25s var(--smooth);
}
.suggestion-item.active .suggestion-icon{
  background:rgba(255,255,255,.14);
  color:#fff;
}
.suggestion-text{
  flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.suggestion-text b{
  color:#fff;
  font-weight:700;
}
.suggestion-arrow{
  flex:0 0 auto;
  color:rgba(255,255,255,.35);
  font-size:12px;
  opacity:0;
  transform:translate3d(-4px,0,0);
  transition:opacity .25s var(--smooth), transform .3s var(--smooth-out);
}
.suggestion-item.active .suggestion-arrow{
  opacity:1;
  transform:translate3d(0,0,0);
}

/* ============ SEARCH HINT ============ */
.search-hint{
  margin-top:16px;font-size:11px;color:var(--muted);
  letter-spacing:.6px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
}
.search-hint kbd{
  background:rgba(255,255,255,.07);border:1px solid var(--brd);
  border-radius:6px;padding:1.5px 7px;font-size:10.5px;font-family:inherit;
  color:rgba(244,245,250,.82);
  box-shadow:0 1px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}

/* ============ QUICK LINKS ============ */
.quicklinks{
  margin-top:42px;
  width:min(740px,92vw);
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:12px;
  animation:fadeUp 1.1s .4s var(--smooth-out) both;
}
.link{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 6px 13px;border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--brd);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  text-decoration:none;color:var(--text);
  transition:
    transform .45s var(--smooth-out),
    background .45s var(--smooth),
    border-color .45s var(--smooth),
    box-shadow .45s var(--smooth);
  position:relative;overflow:hidden;
  transform:translateZ(0);
  will-change:transform;
}
.link::before{
  content:"";position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.18), transparent 70%);
  transition:opacity .5s var(--smooth);
  pointer-events:none;
}
.link:hover{
  transform:translate3d(0,-6px,0) scale(1.04);
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 16px 42px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
}
.link:hover::before{opacity:1}
.link-icon{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  font-size:17px;font-weight:800;color:#fff;position:relative;z-index:1;
  box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .45s var(--smooth-out);
}
.link:hover .link-icon{transform:rotate(-8deg) scale(1.1)}
.link-name{
  font-size:11px;color:var(--muted);letter-spacing:.4px;
  font-weight:500;position:relative;z-index:1;
  transition:color .4s var(--smooth);
}
.link:hover .link-name{color:#fff}

/* ============ SETTINGS BUTTON ============ */
.settings-btn{
  position:fixed;right:22px;bottom:22px;z-index:8;
  width:50px;height:50px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.05);
  border:1px solid var(--brd);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  color:var(--text);cursor:pointer;
  box-shadow:0 12px 36px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .5s var(--smooth-out), background .35s var(--smooth), border-color .35s var(--smooth);
  transform:translateZ(0);
}
.settings-btn:hover{
  transform:rotate(90deg) scale(1.08);
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.24);
}
.settings-btn svg{width:22px;height:22px}

/* ============ SETTINGS PANEL ============ */
.panel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(340px,86vw);z-index:9;
  background:rgba(10,10,14,.9);
  border-left:1px solid var(--brd-strong);
  backdrop-filter:blur(36px) saturate(180%);
  -webkit-backdrop-filter:blur(36px) saturate(180%);
  box-shadow:-30px 0 90px rgba(0,0,0,.85);
  transform:translate3d(105%,0,0);
  transition:transform .55s var(--smooth-out);
  padding:26px 22px;overflow-y:auto;
  will-change:transform;
}
.panel.open{transform:translate3d(0,0,0)}
.panel h2{
  font-size:11.5px;letter-spacing:4px;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:22px;
  display:flex;align-items:center;justify-content:space-between;
}
.panel-close{
  background:rgba(255,255,255,.07);border:1px solid var(--brd);
  border-radius:9px;color:var(--text);cursor:pointer;
  width:28px;height:28px;font-size:14px;
  display:grid;place-items:center;
  transition:background .3s var(--smooth);
}
.panel-close:hover{background:rgba(255,255,255,.15)}

.set-group{margin-bottom:26px}
.set-label{
  font-size:11px;font-weight:600;color:rgba(244,245,250,.75);
  letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:12px;display:block;
}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{
  width:36px;height:36px;border-radius:12px;cursor:pointer;
  border:2px solid transparent;position:relative;
  transition:transform .3s var(--smooth-out), border-color .3s var(--smooth);
  transform:translateZ(0);
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:#fff;transform:scale(1.08)}
.swatch.active::after{
  content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:900;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}

.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.toggle-row:last-child{border-bottom:none}
.toggle-row span{font-size:13.5px;font-weight:500}
.switch{
  position:relative;width:46px;height:26px;flex:0 0 auto;
  background:rgba(255,255,255,.12);border-radius:999px;cursor:pointer;
  transition:background .4s var(--smooth);
  border:1px solid var(--brd);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;
  transition:transform .4s var(--smooth-out);
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.switch.on{background:#fff}
.switch.on::after{
  transform:translate3d(20px,0,0);
  background:#111;
}

.reset-btn{
  width:100%;margin-top:6px;padding:12px;border-radius:13px;cursor:pointer;
  background:rgba(255,255,255,.07);
  border:1px solid var(--brd);
  color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
  letter-spacing:.4px;
  transition:background .3s var(--smooth), border-color .3s var(--smooth);
}
.reset-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}

.panel-foot{
  margin-top:26px;padding-top:18px;
  border-top:1px solid rgba(255,255,255,.06);

<script>
/* =========================================================
   Y HUB — Core Script (Smooth Edition + Suggestions)
   ========================================================= */
(function () {
  "use strict";

  const root = document.documentElement;
  const $ = (id) => document.getElementById(id);

  /* ---------------------------------------------------------
     1. PARTICLES
  --------------------------------------------------------- */
  const Particles = (() => {
    const canvas = $("particles");
    const ctx = canvas.getContext("2d", { alpha: true });
    const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    let W = 0, H = 0, dots = [], raf = null, running = false;

    function resize() {
      W = canvas.width = Math.floor(innerWidth * DPR);
      H = canvas.height = Math.floor(innerHeight * DPR);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
    }

    function build() {
      const count = Math.min(55, Math.floor(innerWidth / 26));
      dots = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.4 + 0.4) * DPR,
        vx: (Math.random() - 0.5) * 0.18 * DPR,
        vy: (Math.random() - 0.5) * 0.18 * DPR,
        a: Math.random() * 0.35 + 0.08
      }));
    }

    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        d.x += d.vx;
        d.y += d.vy;
        if (d.x < -30) d.x = W + 30; else if (d.x > W + 30) d.x = -30;
        if (d.y < -30) d.y = H + 30; else if (d.y > H + 30) d.y = -30;

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + d.a + ")";
        ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (running) return;
      running = true;
      resize(); build(); frame();
    }
    function stop() {
      running = false;
      cancelAnimationFrame(raf); raf = null;
      ctx.clearRect(0, 0, W, H);
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { resize(); build(); }, 150);
    });

    return { start, stop };
  })();

  /* ---------------------------------------------------------
     2. STORAGE
  --------------------------------------------------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const ACCENTS = [
    { name: "Violet",  hex: "#7c5cff", rgb: "124, 92, 255" },
    { name: "Cyan",    hex: "#22d3ee", rgb: "34, 211, 238" },
    { name: "Pink",    hex: "#ec4899", rgb: "236, 72, 153" },
    { name: "Emerald", hex: "#10b981", rgb: "16, 185, 129" },
    { name: "Amber",   hex: "#f59e0b", rgb: "245, 158, 11" },
    { name: "Blue",    hex: "#3b82f6", rgb: "59, 130, 246" }
  ];

  /* ---------------------------------------------------------
     3. CLOCK
  --------------------------------------------------------- */
  const clockMain = $("clockMain"), clockSec = $("clockSec"),
        clockAmPm = $("clockAmPm"), clockDate = $("clockDate"),
        greetingEl = $("greeting");

  let use24h = store.get("yhub-24h", "on") === "on";

  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function greet(h) {
    if (h < 5) return "Good night";
    if (h < 12) return "Good morning";
    if (h < 17) return "Good afternoon";
    if (h < 21) return "Good evening";
    return "Good night";
  }

  function tick() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    let suffix = "";
    if (!use24h) {
      suffix = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
    }
    clockMain.textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    clockSec.textContent = ":" + String(s).padStart(2, "0");
    clockAmPm.textContent = suffix;
    clockDate.textContent = DAYS[now.getDay()] + " · " + MONTHS[now.getMonth()] + " " + now.getDate();

    if (!greetingEl.dataset.locked) {
      greetingEl.innerHTML = greet(now.getHours()) + ', <b>Y</b>';
      greetingEl.dataset.locked = "1";
      setTimeout(() => { greetingEl.dataset.locked = ""; }, 60000);
    }
  }
  tick();
  setInterval(tick, 1000);

  /* ---------------------------------------------------------
     4. SEARCH ENGINES
  --------------------------------------------------------- */
  const ENGINES = {
    google:  { name: "Google",     url: "https://www.google.com/search?q=",              letter: "G", color: "#4285F4" },
    ddg:     { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=",                    letter: "D", color: "#DE5833" },
    bing:    { name: "Bing",       url: "https://www.bing.com/search?q=",                letter: "B", color: "#008373" },
    brave:   { name: "Brave",      url: "https://search.brave.com/search?q=",            letter: "🦁", color: "#FB542B" },
    youtube: { name: "YouTube",    url: "https://www.youtube.com/results?search_query=", letter: "▶", color: "#FF0033" }
  };

  let currentEngine = store.get("yhub-engine", "google");
  if (!ENGINES[currentEngine]) currentEngine = "google";

  const engineWrap = $("engineWrap"),
        engineBtn  = $("engineBtn"),
        engineMenu = $("engineMenu"),
        engineDot  = $("engineDot");

  function renderEngineButton() {
    const e = ENGINES[currentEngine];
    engineDot.textContent = e.letter;
    engineDot.style.background = e.color;
  }

  function buildEngineMenu() {
    engineMenu.innerHTML = "";
    Object.keys(ENGINES).forEach((key) => {
      const e = ENGINES[key];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "engine-item" + (key === currentEngine ? " active" : "");
      btn.innerHTML =
        '<span class="engine-dot" style="background:' + e.color + '">' + e.letter + "</span>" +
        "<span>" + e.name + "</span>" +
        '<span class="check">✓</span>';
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        currentEngine = key;
        store.set("yhub-engine", key);
        renderEngineButton();
        buildEngineMenu();
        engineWrap.classList.remove("open");
        input.focus();
      });
      engineMenu.appendChild(btn);
    });
  }

  renderEngineButton();
  buildEngineMenu();

  engineBtn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    engineWrap.classList.toggle("open");
    if (engineWrap.classList.contains("open")) hideSuggestions();
  });

  document.addEventListener("click", (ev) => {
    if (!engineWrap.contains(ev.target)) engineWrap.classList.remove("open");
    if (!suggestionsEl.contains(ev.target) && ev.target !== input) {
      hideSuggestions();
    }
  });

  /* ---------------------------------------------------------
     5. SEARCH FORM
  --------------------------------------------------------- */
  const form = $("searchForm");
  const input = $("q");
  const URL_RE = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i;

  function submitSearch(value) {
    const raw = (value !== undefined ? value : input.value).trim();
    if (!raw) { input.focus(); return; }
    hideSuggestions();

    if (URL_RE.test(raw)) {
      window.location.href = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
      return;
    }
    window.location.href = ENGINES[currentEngine].url + encodeURIComponent(raw);
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    submitSearch();
  });

  /* ---------------------------------------------------------
     6. SUGGESTIONS (Google-style autocomplete)
  --------------------------------------------------------- */
  const suggestionsEl = $("suggestions");
  let suggList = [];
  let suggActive = -1;
  let suggAbort = null;
  let suggTimer = null;
  let suggToken = 0;

  function hideSuggestions() {
    suggestionsEl.classList.remove("open");
    suggestionsEl.innerHTML = "";
    suggActive = -1;
    input.setAttribute("aria-expanded", "false");
  }

  function renderSuggestions(query) {
    if (!suggList.length) { hideSuggestions(); return; }

    suggActive = -1;
    const ql = query.toLowerCase();
    const frag = document.createDocumentFragment();

    suggList.forEach((s, i) => {
      const text = String(s);
      // Escape then highlight match
      const safe = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      let display = safe;
      if (ql) {
        const lower = safe.toLowerCase();
        const idx = lower.indexOf(ql);
        if (idx >= 0) {
          display =
            safe.slice(0, idx) +
            "<b>" + safe.slice(idx, idx + query.length) + "</b>" +
            safe.slice(idx + query.length);
        }
      }

      const item = document.createElement("div");
      item.className = "suggestion-item";
      item.dataset.idx = String(i);
      item.setAttribute("role", "option");
      item.innerHTML =
        '<span class="suggestion-icon" aria-hidden="true">🔍</span>' +
        '<span class="suggestion-text">' + display + "</span>" +
        '<span class="suggestion-arrow" aria-hidden="true">↵</span>';
      frag.appendChild(item);
    });

    suggestionsEl.innerHTML = "";
    suggestionsEl.appendChild(frag);
    suggestionsEl.classList.add("open");
    input.setAttribute("aria-expanded", "true");
  }

  function fetchSuggestions(q) {
    const myToken = ++suggToken;
    if (suggAbort) { try { suggAbort.abort(); } catch (e) {} }
    suggAbort = ("AbortController" in window) ? new AbortController() : null;
    const signal = suggAbort ? suggAbort.signal : undefined;

    // Primary: DuckDuckGo autocomplete (Google-like suggestions)
    fetch("https://duckduckgo.com/ac/?q=" + encodeURIComponent(q) + "&type=list", { signal })
      .then((r) => r.ok ? r.json() : Promise.reject())
      .then((data) => {
        if (myToken !== suggToken) return;
        if (Array.isArray(data)) {
          suggList = data
            .map((d) => (typeof d === "string" ? d : (d && d.phrase) || ""))
            .filter(Boolean)
            .slice(0, 8);
        } else {
          suggList = [];
        }
        renderSuggestions(q);
      })
      .catch((err) => {
        if (err && err.name === "AbortError") return;
        if (myToken !== suggToken) return;
        // Fallback: Wikipedia opensearch (very reliable CORS)
        fetch(
          "https://en.wikipedia.org/w/api.php?action=opensearch&search=" +
          encodeURIComponent(q) + "&limit=8&format=json&origin=*",
          { signal }
        )
          .then((r) => r.ok ? r.json() : Promise.reject())
          .then((data) => {
            if (myToken !== suggToken) return;
            suggList = (Array.isArray(data) && Array.isArray(data[1])) ? data[1].slice(0, 8) : [];
            renderSuggestions(q);
          })
          .catch(() => {
            if (myToken !== suggToken) return;
            suggList = [];
            hideSuggestions();
          });
      });
  }

  function updateActiveSuggestion() {
    const items = suggestionsEl.querySelectorAll(".suggestion-item");
    items.forEach((el, i) => el.classList.toggle("active", i === suggActive));
    if (suggActive >= 0 && items[suggActive]) {
      items[suggActive].scrollIntoView({ block: "nearest" });
      input.setAttribute("aria-activedescendant", "sugg-" + suggActive);
    } else {
      input.removeAttribute("aria-activedescendant");
    }
  }

  function selectSuggestion(text) {
    if (!text) return;
    input.value = text;
    hideSuggestions();
    submitSearch(text);
  }

  /* Input events */
  input.addEventListener("input", () => {
    clearTimeout(suggTimer);
    const v = input.value.trim();
    if (!v) { hideSuggestions(); return; }
    suggTimer = setTimeout(() => fetchSuggestions(v), 170);
  });

  input.addEventListener("focus", () => {
    if (suggList.length && input.value.trim()) {
      renderSuggestions(input.value.trim());
    }
  });

  input.addEventListener("blur", () => {
    setTimeout(() => {
      // If mousedown on suggestion prevented blur, this won't fire.
      // Otherwise hide after a short delay.
      if (!suggestionsEl.matches(":hover")) hideSuggestions();
    }, 150);
  });

  /* Mouse interaction — mousedown preventDefault stops input blur */
  suggestionsEl.addEventListener("mousedown", (e) => {
    e.preventDefault();
  });

  suggestionsEl.addEventListener("click", (e) => {
    const item = e.target.closest(".suggestion-item");
    if (!item) return;
    const idx = parseInt(item.dataset.idx, 10);
    if (Number.isFinite(idx) && suggList[idx]) {
      selectSuggestion(suggList[idx]);
    }
  });

  suggestionsEl.addEventListener("mousemove", (e) => {
    const item = e.target.closest(".suggestion-item");
    if (!item) return;
    const idx = parseInt(item.dataset.idx, 10);
    if (Number.isFinite(idx) && idx !== suggActive) {
      suggActive = idx;
      updateActiveSuggestion();
    }
  });

  suggestionsEl.addEventListener("mouseleave", () => {
    if (suggActive !== -1) {
      suggActive = -1;
      updateActiveSuggestion();
    }
  });

  /* ---------------------------------------------------------
     7. QUICK LINKS
  --------------------------------------------------------- */
  const LINKS = [
    { name: "YouTube",  url: "https://youtube.com",       letter: "▶", color: "#FF0033" },
    { name: "Gmail",    url: "https://mail.google.com",   letter: "M", color: "#EA4335" },
    { name: "GitHub",   url: "https://github.com",        letter: "◉", color: "#6e5494" },
    { name: "WhatsApp", url: "https://web.whatsapp.com",  letter: "✆", color: "#25D366" },
    { name: "Instagram",url: "https://instagram.com",     letter: "◎", color: "#E1306C" },
    { name: "X",        url: "https://x.com",             letter: "𝕏", color: "#0f1419" },
    { name: "Reddit",   url: "https://reddit.com",        letter: "◕", color: "#FF4500" },
    { name: "ChatGPT",  url: "https://chat.openai.com",   letter: "✦", color: "#10A37F" },
    { name: "Netflix",  url: "https://netflix.com",       letter: "N", color: "#E50914" },
    { name: "Spotify",  url: "https://open.spotify.com",  letter: "♫", color: "#1DB954" },
    { name: "Drive",    url: "https://drive.google.com",  letter: "△", color: "#FBBC04" },
    { name: "Maps",     url: "https://maps.google.com",   letter: "◈", color: "#4285F4" }
  ];

  const quicklinks = $("quicklinks");
  LINKS.forEach((l) => {
    const a = document.createElement("a");
    a.className = "link";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML =
      '<span class="link-icon" style="background:linear-gradient(140deg,' + l.color + ',rgba(0,0,0,.6))">' +
        l.letter +
      "</span>" +
      '<span class="link-name">' + l.name + "</span>";
    quicklinks.appendChild(a);
  });

  /* ---------------------------------------------------------
     8. WEATHER (Open-Meteo, no key)
  --------------------------------------------------------- */
  const WCODES = {
    0: ["☀️", "Clear sky"], 1: ["🌤️", "Mainly clear"], 2: ["⛅", "Partly cloudy"], 3: ["☁️", "Overcast"],
    45: ["🌫️", "Fog"], 48: ["🌫️", "Rime fog"],
    51: ["🌦️", "Light drizzle"], 53: ["🌦️", "Drizzle"], 55: ["🌧️", "Heavy drizzle"],
    56: ["🌧️", "Freezing drizzle"], 57: ["🌧️", "Freezing drizzle"],
    61: ["🌧️", "Light rain"], 63: ["🌧️", "Rain"], 65: ["🌧️", "Heavy rain"],
    66: ["🌧️", "Freezing rain"], 67: ["🌧️", "Freezing rain"],
    71: ["🌨️", "Light snow"], 73: ["🌨️", "Snow"], 75: ["❄️", "Heavy snow"], 77: ["🌨️", "Snow grains"],
    80: ["🌦️", "Rain showers"], 81: ["🌧️", "Rain showers"], 82: ["⛈️", "Violent showers"],
    85: ["🌨️", "Snow showers"], 86: ["❄️", "Heavy snow showers"],
    95: ["⛈️", "Thunderstorm"], 96: ["⛈️", "Thunderstorm"], 99: ["⛈️", "Thunderstorm"]
  };

  const wIcon = $("wIcon"), wTemp = $("wTemp"), wDesc = $("wDesc");

  function setWeather(icon, temp, desc) {
    wIcon.textContent = icon;
    wTemp.textContent = temp + "°";
    wDesc.textContent = desc;
  }

  function failWeather(msg) {
    wIcon.textContent = "🌐";
    wTemp.textContent = "--°";
    wDesc.textContent = msg;
  }

  function loadWeather(lat, lon) {
    const url =
      "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lon +
      "&current=temperature_2m,weather_code&timezone=auto";
    fetch(url)
      .then((r) => r.json())
      .then((data) => {
        const cur = data.current;
        if (!cur) throw new Error("no data");
        const info = WCODES[cur.weather_code] || ["🌡️", "Unknown"];
        setWeather(info[0], Math.round(cur.temperature_2m), info[1]);
      })
      .catch(() => failWeather("Unavailable"));
  }

  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
      () => failWeather("No location"),
      { timeout: 9000, maximumAge: 600000 }
    );
  } else {
    failWeather("No geolocation");
  }

  /* ---------------------------------------------------------
     9. SETTINGS PANEL
  --------------------------------------------------------- */
  const panel = $("panel"), scrim = $("scrim"),
        settingsBtn = $("settingsBtn"), panelClose = $("panelClose");

  function openPanel() { panel.classList.add("open"); scrim.classList.add("show"); }
  function closePanel() { panel.classList.remove("open"); scrim.classList.remove("show"); }

  settingsBtn.addEventListener("click", () => {
    panel.classList.contains("open") ? closePanel() : openPanel();
  });
  panelClose.addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);

  const swatchesEl = $("swatches");
  function applyAccent(a) {
    root.style.setProperty("--accent", a.hex);
    root.style.setProperty("--accent-rgb", a.rgb);
    store.set("yhub-accent", a.hex);
    [...swatchesEl.children].forEach((el) =>
      el.classList.toggle("active", el.dataset.hex === a.hex)
    );
  }

  ACCENTS.forEach((a) => {
    const sw = document.createElement("button");
    sw.type = "button";
    sw.className = "swatch";
    sw.dataset.hex = a.hex;
    sw.title = a.name;
    sw.style.background = "linear-gradient(140deg," + a.hex + ",rgba(0,0,0,.6))";
    sw.addEventListener("click", () => applyAccent(a));
    swatchesEl.appendChild(sw);
  });

  const savedAccent = store.get("yhub-accent", "#7c5cff");
  applyAccent(ACCENTS.find((a) => a.hex === savedAccent) || ACCENTS[0]);

  function bindToggle(el, initial, onChange) {
    let state = initial;
    el.classList.toggle("on", state);
    el.setAttribute("aria-checked", state ? "true" : "false");
    function flip() {
      state = !state;
      el.classList.toggle("on", state);
      el.setAttribute("aria-checked", state ? "true" : "false");
      onChange(state);
    }
    el.addEventListener("click", flip);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
    });
  }

  const tParticles = $("tParticles"), tClock = $("tClock"), tFloat = $("tFloat");
  const logoEl = document.querySelector(".logo");

  bindToggle(tParticles, store.get("yhub-particles", "on") === "on", (on) => {
    store.set("yhub-particles", on ? "on" : "off");
    on ? Particles.start() : Particles.stop();
  });

  bindToggle(tClock, use24h, (on) => {
    use24h = on;
    store.set("yhub-24h", on ? "on" : "off");
    tick();
  });

  bindToggle(tFloat, store.get("yhub-float", "on") === "on", (on) => {
    store.set("yhub-float", on ? "on" : "off");
    logoEl.classList.toggle("paused-float", !on);
  });

  $("resetBtn").addEventListener("click", () => {
    ["yhub-accent", "yhub-engine", "yhub-particles", "yhub-24h", "yhub-float"]
      .forEach((k) => { try { localStorage.removeItem(k); } catch (e) {} });
    location.reload();
  });

  /* ---------------------------------------------------------
     10. KEYBOARD SHORTCUTS
  --------------------------------------------------------- */
  document.addEventListener("keydown", (e) => {
    const active = document.activeElement;
    const typing = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
    const suggOpen = suggestionsEl.classList.contains("open");

    /* --- Arrow navigation in suggestions --- */
    if (suggOpen && typing) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        suggActive = Math.min(suggActive + 1, suggList.length - 1);
        if (suggActive < 0) suggActive = 0;
        updateActiveSuggestion();
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        suggActive = Math.max(suggActive - 1, -1);
        updateActiveSuggestion();
        return;
      }
      if (e.key === "Enter" && suggActive >= 0 && suggList[suggActive]) {
        e.preventDefault();
        selectSuggestion(suggList[suggActive]);
        return;
      }
    }

    /* --- Focus search --- */
    if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
      e.preventDefault();
      input.focus();
      input.select();
      return;
    }

    /* --- Escape: close top-most thing --- */
    if (e.key === "Escape") {
      if (suggOpen) { hideSuggestions(); return; }
      if (panel.classList.contains("open")) { closePanel(); return; }
      engineWrap.classList.remove("open");
      if (input.value) { input.value = ""; }
      input.blur();
    }
  });

  /* ---------------------------------------------------------
     11. INIT
  --------------------------------------------------------- */
  if (store.get("yhub-particles", "on") === "on") {
    Particles.start();
  } else {
    tParticles.classList.remove("on");
  }

  if (store.get("yhub-float", "on") !== "on") {
    logoEl.classList.add("paused-float");
    tFloat.classList.remove("on");
  }

  if (window.matchMedia("(min-width: 900px)").matches) {
    setTimeout(() => input.focus({ preventScroll: true }), 600);
  }

  console.log(
    "%c Y HUB ",
    "background:#fff;color:#000;font-weight:900;padding:6px 14px;border-radius:8px;font-size:14px;"
  );
  console.log("Type to see suggestions · ↑↓ to navigate · Enter to pick · Esc to close");
})();
</script>
</body>
</html>
